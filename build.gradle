plugins {
    id 'application'
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.4.5'
}


bootJar {
    baseName = 'ia-case-creator'
    version =  '0.0.1'
}


repositories {
    mavenCentral()
    mavenLocal()

    maven { url 'https://jitpack.io' }
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.1"
    }
}

dependencies {

    implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-bootstrap'

    implementation group: 'io.rest-assured', name: 'rest-assured', version: '5.5.5'
    implementation group: 'io.rest-assured', name: 'json-path', version: '5.5.5'

    implementation group: 'org.projectlombok', name: 'lombok', version: '1.18.38'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.38'

    implementation group: 'com.github.hmcts', name: 'core-case-data-store-client', version: '4.7.6'

    implementation group: 'com.github.hmcts', name: 'service-auth-provider-java-client', version: '5.3.2'
    implementation group: 'com.github.hmcts', name: 'auth-checker-lib', version: '3.1.1'

    implementation 'com.github.hmcts:document-management-client:7.0.1'
    implementation group: 'org.springframework', name: 'spring-test', version: '5.1.7.RELEASE'

    implementation 'com.google.code.gson:gson:2.8.5'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jdk8'
    implementation group: 'com.github.hmcts', name: 'ccd-case-document-am-client', version: '1.7.1'

    implementation group: 'commons-io', name: 'commons-io', version: '2.10.0'


}

mainClassName='uk.gov.hmcts.reform.ia.casecreator.Application'

applicationDefaultJvmArgs = ["-Dfile.encoding=UTF-8"]
